[project]
name = "vcl"
version = "0.2.0"
description = "Voynich AI Cryptolinguist: a pre-registered, known-answer-validated programme for deciphering the Voynich Manuscript"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arham Partap Jain" }, { name = "Savir Platforms Private Limited" }]
keywords = ["voynich", "decipherment", "cryptanalysis", "computational-linguistics", "undeciphered-scripts"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "torch==2.7.1",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]
repro = ["python-docx==1.2.0", "pandas==2.3.1", "scipy==1.16.0", "scikit-learn==1.7.1"]
# neural decipherer (E009): Apple-Silicon MLX + Qwen2.5-0.5B base weights fetched from the HF hub at first use
neural = ["mlx==0.32.4", "mlx-metal==0.32.4", "mlx-lm==0.32.0", "scikit-learn==1.7.1"]

[project.urls]
Homepage = "https://github.com/Savirinc/voynich-ai-cryptolinguist"
Citation = "https://github.com/Savirinc/voynich-ai-cryptolinguist/blob/main/CITATION.cff"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
