[project]
name = "vcl"
version = "0.1.0"
description = "Voynich AI Cryptolinguist: learning to decipher unknown writing systems, with known-answer controls"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "torch==2.7.1",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]
repro = ["python-docx==1.2.0", "pandas==2.3.1", "scipy==1.16.0", "scikit-learn==1.7.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
